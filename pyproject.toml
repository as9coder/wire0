[project]
name = "wire0"
version = "0.1.1"
description = "Minimal coding agent CLI — wire your model to the repo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "as9coder" }]
keywords = ["cli", "agent", "openrouter", "coding", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
]

[project.urls]
Homepage = "https://github.com/as9coder/wire0"
Repository = "https://github.com/as9coder/wire0"
Issues = "https://github.com/as9coder/wire0/issues"

[project.scripts]
wire0 = "wire0.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wire0"]
