[project]
name = "wire0"
version = "0.1.0"
description = "Minimal coding agent CLI — wire your model to the repo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
]

[project.scripts]
wire0 = "wire0.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wire0"]
